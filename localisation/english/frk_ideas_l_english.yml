  ENG_Curzon_ambitions:0 "Curzon's ambitions"
  ENG_Curzon_ambitions_desc:0 "The Lord George Curzon had ran for prime minister under the Conservative Party in 1922, he campaigned on fixing the mistakes of Lansdowne and reclaming Afghanistan with a full military might. One of his other promises was to launch an invasion of Tibet and expand the British empire's dominance over eastern asia. He also wanted to increase the strength of the Chinese Emperor and to conquer new treaty ports within the Shandong peninsula."
  ENG_Demontfort_legion:0 "Legacy of the legion"
  ENG_Demontfort_legion_desc:0 "During the French civil war in 1923 and 1922, Britain sent a grand legion of volunteer forces to help the republican government, even despite the previous hostilities. This expedition by the British proved ultimately a failure with the Battle of Calais causing British soldiers to flee to Britain through Dieppe. Other soldiers were made to walk through to alsace lorraine and station in Germany, these soldiers would form the idea of a British foreign legion to fight in Germany and Italy in case of French aggression."
  ENG_Lansdownes_emb:0 "Lansdowne's embarrasement"
  ENG_Lansdownes_emb_desc:0 "The previous prime minister, the Lord Lansdowne, had attampted an invasion of Afghanistan in order to bring them back as a protectorate or even integrate them into the British Raj for his friend, the Lord Curzon, the war however ended in disaster after the British government was forced to grant war reperations and cede Peshawar and Quetta"
  ENG_workers_strikes:0 "Great workers strike"
  ENG_workers_strikes_desc:0 "Known to the public of the Great Workers Strike, mass strikes across the United Kingdom broke out in 1923 caused partly by the revolution in France. The French Civil War and success was inspirational for the British people and was used by the BSP as propaganda, members of the Veterans party even succumbed to the French ideology and strikes.  The strikes were organised mainly by Scottish unionist John Maclean, these strikes would spread further south to England rapidly especially around places with large amounts of population like London with the heaviest of the Strikes taking place from union members in Wales."
  ENG_hankey_plan:0 "The Hankey Plan"
  ENG_hankey_plan_desc:0 "The Hankey Plan was a developement plan developed by prime minister Edwin Montagu and Maurice Hankey, the goal of this plan is to increase industrial output across the nation and to build 3 new towns in northern England, these towns being built in Leeds, Derby and York. The reason for this was due to a large influx of refugees arriving from Russia, France and China. Russia having a rise in Pogroms and domestic terrorism and the other two nations recently having a civil war."
  ENG_IRA_terror:0 "Irish terrorism"
  ENG_IRA_terror_desc:0 "Over the last fews groups like the IRA have spiked in membership, the British having banned Sinn Féin previously and Balfour's act to grant greater funding to the RICover time this has lead to a great amount of dissent in the Irish populace. Unionism as an ideology in Britain was slowly starting to fade away and demands for home rule rises, the RIC has become almost entirely dysfunctional with IRA members entering the constabulry and then striking. The current prime minister Edwin Montagu has outlined new plans to deal with this, the 'irish unionist volunteer army' or the IUVA, this idea is seen as being quite attractive to the British army with JFC Fuller, the head of the British Veterans party, being the main man behind the idea with plans to have Sir Henry Wilson as leader of the army."